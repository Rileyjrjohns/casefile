name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python, frontend and replay checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Install Python from .python-version
        run: uv python install
      - name: Install locked dependencies
        run: make sync
      - name: Install Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked frontend dependencies
        run: make web-sync
      - name: Prepare isolated PostgreSQL test images
        run: |
          docker pull postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          docker pull testcontainers/ryuk:0.8.1
      - name: Lint, typecheck, architecture and tests
        env:
          UV_OFFLINE: "true"
        run: make check
      - name: Replay evaluations and regression thresholds
        id: evals
        env:
          UV_OFFLINE: "true"
        run: make eval
      - name: Publish replay evaluation reports
        if: ${{ always() && (steps.evals.outcome == 'success' || steps.evals.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: replay-evaluations-${{ github.sha }}
          path: build/evals/**
          if-no-files-found: error
          retention-days: 14
